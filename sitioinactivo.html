<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sitio en mantenimiento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #6d28d9);
      background-size: 300% 300%;
      animation: fondo 14s ease infinite;
      overflow: hidden;
      padding: 20px;
    }

    @keyframes fondo {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .burbuja {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
      animation: flotar 12s ease-in-out infinite;
    }
    .b1 { width: 260px; height: 260px; top: -60px; left: -60px; }
    .b2 { width: 180px; height: 180px; bottom: 8%; right: 6%; animation-delay: -4s; }
    .b3 { width: 120px; height: 120px; top: 20%; right: 20%; animation-delay: -8s; }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }

    .tarjeta {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: 56px 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    }

    .engranes {
      position: relative;
      width: 110px;
      height: 110px;
      margin: 0 auto 28px;
    }
    .engranes svg { position: absolute; fill: #fff; }
    .g1 { width: 74px; height: 74px; top: 0; left: 0; animation: girar 6s linear infinite; }
    .g2 { width: 54px; height: 54px; bottom: 0; right: 0; opacity: .85; animation: girar 4.5s linear infinite reverse; }

    @keyframes girar { to { transform: rotate(360deg); } }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      margin-bottom: 16px;
    }

    p {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.85);
    }

    .barra {
      height: 6px;
      margin: 32px auto 0;
      max-width: 240px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    .barra span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: #fff;
      animation: carga 1.8s ease-in-out infinite;
    }

    @keyframes carga {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    @media (max-width: 480px) {
      .tarjeta { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <div class="burbuja b1"></div>
  <div class="burbuja b2"></div>
  <div class="burbuja b3"></div>

  <main class="tarjeta">
    <div class="engranes" aria-hidden="true">
      <svg class="g1" viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.7 8.78a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0-.06.94c0 .32.02.63.06.94L2.82 14.46a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.05.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96c.23.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
      <svg class="g2" viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 .06-.94 7.5 7.5 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.61.22L2.7 8.78a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0-.06.94c0 .32.02.63.06.94L2.82 14.46a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.05.7 1.63.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7 7 0 0 0 1.63-.94l2.39.96c.23.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
    </div>

    <h1>Sitio en mantenimiento</h1>
    <p>Estamos realizando mejoras para ofrecerte una mejor experiencia.<br>Volveremos muy pronto. ¡Gracias por tu paciencia!</p>

    <div class="barra" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
